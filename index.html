<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Presupuestos de imprenta</title>
<style>
:root{--bg:#fafafc;--cd:#fff;--tx:#1d1f3a;--mu:#6c6f8a;--bd:#e6e7ef;--ac:#3f4094;--ak:#fff;--rd:#d83439;--yl:#f3e928;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11121d;--cd:#191b2b;--tx:#ecedf8;--mu:#9a9db6;--bd:#2a2d45;--ac:#9297f2;--ak:#12132b;--rd:#ef5b61}}
:root[data-theme="dark"]{--bg:#11121d;--cd:#191b2b;--tx:#ecedf8;--mu:#9a9db6;--bd:#2a2d45;--ac:#9297f2;--ak:#12132b;--rd:#ef5b61}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{max-width:640px;margin:0 auto;padding:14px 16px 0;display:flex;align-items:center;gap:10px}
header img{height:38px;width:auto;background:#fff;border-radius:8px}
header span{font-weight:600;color:var(--mu);font-size:14px}
main{max-width:640px;margin:0 auto;padding:12px 16px 170px}
h1{font-size:24px;font-weight:650;margin:8px 0 4px;letter-spacing:-.02em}h2{font-size:14px;font-weight:600;color:var(--mu);margin:20px 0 8px}
.sub{color:var(--mu);margin:0 0 16px;font-size:14.5px}.sm{color:var(--mu);font-size:13px;margin:0}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px 38px 14px 14px;margin-bottom:10px;position:relative}.card.f{padding-right:14px}
.fs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.card>.fs>label:first-child{grid-column:1/-1}
summary{cursor:pointer;color:var(--ac);font-size:13px;font-weight:600;margin-top:10px}
label{display:block;font-size:12px;color:var(--mu)}
input,select{width:100%;box-sizing:border-box;margin-top:4px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:transparent;color:var(--tx);font:inherit;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 18%,transparent)}
.dv{margin:10px 0 0;font-size:13px;color:var(--ac);font-weight:600}.dv:empty{display:none}
.x{position:absolute;top:6px;right:8px;border:0;background:none;color:var(--mu);font-size:22px;cursor:pointer}
.add{border:0;background:none;color:var(--ac);font:inherit;font-weight:600;padding:8px 2px;cursor:pointer}
.btn{border:1px solid var(--ac);background:var(--ac);color:var(--ak);padding:11px 20px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:none;color:var(--tx);border-color:var(--bd)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.steps{display:flex;gap:20px;overflow-x:auto;margin-bottom:18px;border-bottom:1px solid var(--bd)}
.steps button{flex:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;color:var(--mu);font:inherit;font-size:14px;padding:8px 0;cursor:pointer}
.steps button.on{color:var(--tx);font-weight:600;border-color:var(--yl)}.steps button.ok{color:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding:0 4px env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-top:3px solid transparent;background:none;color:var(--mu);font:inherit;font-size:11px;padding:8px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--ac);border-color:var(--yl)}
#tot{position:fixed;right:14px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--rd);color:#fff;padding:8px 14px;border-radius:99px;font-weight:700;font-size:15px}
@keyframes pop{50%{transform:scale(1.07)}}#tot.pop{animation:pop .22s}
table{width:100%;border-collapse:collapse}td{padding:5px 0}td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.t td{border-top:1px solid var(--bd);font-weight:700}
#doc{background:#fff;color:#1d1f3a;border:1px solid var(--bd);border-radius:6px;overflow:hidden;font-size:14px;margin-bottom:10px}
#doc .rl{height:5px;background:linear-gradient(90deg,#d83439 0 62%,#f3e928 62% 82%,#3f4094 82%)}
#doc .hd{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 22px 12px}
#doc img{height:70px;width:auto}
#doc .ti{text-align:right;color:#6c6f8a;font-size:13px}#doc .ti b{display:block;font-size:19px;color:#3f4094;letter-spacing:.04em}
#doc .bd{padding:4px 22px 18px}
#doc table{color:#1d1f3a}#doc .it th{text-align:left;font-size:12px;font-weight:600;color:#6c6f8a;border-bottom:1px solid #e6e7ef;padding:6px 0}
#doc .it td{padding:10px 0;border-bottom:1px solid #e6e7ef}
#doc .it th:nth-child(n+2),#doc .it td:nth-child(n+2){text-align:right}
#doc .tot{width:62%;margin:14px 0 0 auto}
#doc .tt td{background:#3f4094;color:#fff;font-weight:700;padding:10px 12px}
#doc .tot td{padding:5px 0}#doc .tot td:last-child{padding-right:0}#doc .tt td:last-child{padding-right:12px}
#doc .ft{background:#d83439;color:#fff;padding:11px 22px;font-size:13px}
a{color:var(--ac);cursor:pointer}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);border-radius:12px;padding:0 12px;background:var(--cd)}.search svg{flex:none;color:var(--mu)}.search input{border:0;margin:0;background:transparent;box-shadow:none!important}
.num{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--yl);color:#1d1f3a;font-weight:700;font-size:13px;align-items:center;justify-content:center;margin-right:8px}
.chip{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.pick{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--bd);background:none;color:var(--tx);font:inherit;padding:10px 4px;cursor:pointer}
.ck{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:14px}.ck.ok{color:var(--mu);text-decoration:line-through}
#ts{display:none;position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:12px 14px;border-radius:12px;text-align:center;font-size:14px;z-index:5}
.seg{display:flex;gap:6px;margin-top:4px}.seg button{flex:1;padding:10px;border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:10px;font:inherit;cursor:pointer}.seg button.on{background:var(--ac);color:var(--ak);border-color:var(--ac)}
.big{font-size:36px;font-weight:700;color:var(--rd);letter-spacing:-.02em;line-height:1.1}.big small{display:block;font-size:14px;font-weight:500;color:var(--mu);letter-spacing:0}
.hint{background:color-mix(in srgb,var(--yl) 22%,var(--cd));border-color:var(--yl)}
.pills{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}.pills button{flex:none;border:1px solid var(--bd);background:var(--cd);color:var(--mu);font:inherit;font-size:14px;padding:7px 14px;border-radius:99px;cursor:pointer}.pills button.on{background:var(--ac);color:var(--ak);border-color:var(--ac)}
.res ul{padding-left:18px;margin:10px 0}.res li{margin-bottom:6px;font-size:14px}
@page{margin:10mm}
@media print{html,body{background:#fff!important}body *{visibility:hidden}#doc,#doc *{visibility:visible;-webkit-print-color-adjust:exact;print-color-adjust:exact}#doc{position:absolute;left:0;top:0;width:100%;border:0;border-radius:0}}
</style></head>

<div class="card f"><h2 style="margin-top:0"><span class="num">3</span>¿Cómo se imprime?</h2><label>Tipo</label>${seg('color',[['Blanco y negro',0],['Color',1]],r.color)}<label style="margin-top:12px">Caras</label>${seg('caras',[['Una cara',1],['Doble cara',2]],r.caras)}<label style="margin-top:12px">Equipo${sel2(c.maqs,r.eq,'qe')}</label><p class="sm" style="margin-top:8px">El toner o la tinta se calcula con lo que cargaste en Costos.</p></div>
<div class="card f"><h2 style="margin-top:0"><span class="num">4</span>¿Cuánto tiempo lleva?</h2><p class="sm" style="margin-bottom:10px">Horas que le dedica cada persona a este trabajo. Si no participa, dejalo vacío.</p><div class="fs">${c.puestos.map((p,i)=>`<label>${e(p[0])}<input type="number" step="any" inputmode="decimal" placeholder="0" value="${r.h[i]||''}" oninput="qh(${i},this.value)"></label>`).join('')}</div></div>
<div class="card f"><h2 style="margin-top:0"><span class="num">5</span>¿Algo más?</h2><div class="fs"><label>Otros costos $ (flete, terminación externa…)<input type="number" step="any" inputmode="decimal" placeholder="0" value="${r.ext||''}" oninput="qr('ext',this.value)"></label><label>Velocidad del equipo (páginas por minuto)<input type="number" inputmode="decimal" value="${r.ppm}" oninput="qr('ppm',this.value)"></label></div></div>
<div class="card f res"><p class="sm">Precio final con IVA</p><div id="rt" class="big"></div><details><summary>¿Cómo se calculó?</summary><div id="rx"></div></details><div class="row"><button class="btn" onclick="ST=5;go('q')">Ver presupuesto y enviar</button><button class="btn g" onclick="save();toast('Presupuesto guardado')">Guardar</button></div></div>`}
let CQ='',CE=null,CD={},CBack=0;
const CFLD=[['nombre','Nombre'],['apellido','Apellido'],['empresa','Empresa (si es una empresa)'],['cel','Celular de WhatsApp (con código de área, sin 0 ni 15)'],['dni','DNI'],['cuit','CUIT'],['email','Email'],['dir','Dirección'],['nota','Notas']];
function CLV(){if(CE!==null)return`<h1>${CE=='new'?'Nuevo cliente':'Editar cliente'}</h1><p class="sub">Completá lo que tengas. Solo hace falta el nombre o la empresa; con el celular podés enviarle el PDF por WhatsApp.</p><div class="card f"><div class="fs">${CFLD.map(([k,l])=>`<label>${l}<input value="${e(CD[k])}" ${k=='cel'?'inputmode="tel" placeholder="388 4123456"':''} oninput="CD['${k}']=this.value"></label>`).join('')}</div></div><div class="row"><button class="btn" onclick="csave()">Guardar cliente</button><button class="btn g" onclick="CE=null;CBack=0;V()">Cancelar</button></div>`;
return`<h1>Clientes</h1><p class="sub">Guardá a tus clientes una vez y buscalos cuando armes un presupuesto.</p><div class="search">${LUPA}<input placeholder="Buscar por nombre, apellido, celular, DNI, CUIT…" value="${e(CQ)}" oninput="CQ=this.value;CL()"></div><div id="cll" style="margin-top:12px"></div><button class="add" onclick="cedit('new')">+ Nuevo cliente</button>`}
function CL(){const o=$('#cll');if(!o)return;const m=S.clientes.filter(c=>!CQ.trim()||cm(c,CQ));o.innerHTML=m.map(c=>`<div class="card"><button class="x" onclick="cdel(${c.id})" title="Borrar">×</button><b>${e(cn(c))}</b><p class="sm">${e(cinfo(c)||'Sin más datos')}</p><div class="row" style="margin-top:8px"><button class="btn" onclick="Q=nq();pick(${c.id});go('r')">Cotizar</button><button class="btn g" onclick="cedit(${c.id})">Editar</button></div></div>`).join('')||`<p class="sub">${S.clientes.length?'No encontré a nadie con ese dato.':'Todavía no guardaste clientes.'}</p>`}
function cedit(id){CE=id;CD=id=='new'?{}:{...S.clientes.find(x=>x.id==id)};V()}
function csave(){if(!(CD.nombre||CD.empresa||CD.apellido)){toast('Poné al menos un nombre o la empresa');return}
if(CE=='new'){CD.id=Date.now();S.clientes.unshift(CD)}else{const i=S.clientes.findIndex(x=>x.id==CE);S.clientes[i]=CD}
if(CBack){pick(CD.id);CBack=0;CE=null;sv();go('r');return}CE=null;sv();V()}
function cdel(id){if(confirm('¿Borrar este cliente?')){S.clientes=S.clientes.filter(x=>x.id!=id);sv();V()}}
function qsync(){const r=Q.r,c=S.cfg,pg=(Q.cant||0)*r.caras;Q.pa=[[r.papel,Q.cant||0]];Q.mq=[[r.eq,pg/Math.max(r.ppm,1)/60,r.color?0:pg,r.color?pg:0]];Q.mo=c.puestos.map((p,i)=>[i,r.h[i]||0]);Q.mat=[];Q.ot=[['Otros costos',r.ext||0]]}
function qs(k,v){Q.r[k]=v;V()}function qp(v){Q.r.papel=+v;sum()}function qe(v){Q.r.eq=+v;sum()}function qr(k,v){Q.r[k]=num(v);sum()}function qh(i,v){Q.r.h[i]=num(v);sum()}
function rx(t){const c=S.cfg,r=Q.r,pg=(Q.cant||0)*r.caras,o=$('#rt');if(!o)return;
o.innerHTML=f(t.total)+`<small>${f(t.u)} por unidad</small>`;
const L=[['Papel',t.pap,`${Q.cant||0} hojas a su precio por hoja, más ${c.merma}% de desperdicio`],['Toner o tinta',t.ton,`${pg} páginas ${r.color?'a color':'en blanco y negro'}, según lo que rinde cada toner o botella`],['Luz',t.luz,'las horas que la máquina trabaja por lo que consume'],['Mano de obra',t.mo,'las horas de cada persona por el costo de su hora'],['Gastos fijos del taller',t.ind,'la parte proporcional de alquiler, internet, impuestos, etc., según las horas'],['Otros costos',t.ot,'lo que cargaste a mano']];
$('#rx').innerHTML=`<ul>${L.map(([a,b,d])=>`<li><b>${a}: ${f(b)}</b> — ${d}.</li>`).join('')}</ul><p class="sm">Costo total ${f(t.costo)} + ganancia ${c.gan}% (${f(t.gan)}) = ${f(t.neto)}. Más IVA ${c.iva}% (${f(t.iva)}) = ${f(t.total)}.</p>`}

function mkPdf(){const t=calc(),c=S.cfg,H=842,W=595;
const C={red:'.847 .204 .224',yel:'.953 .914 .157',blu:'.247 .251 .580',ink:'.114 .122 .227',gry:'.424 .435 .541',lin:'.902 .906 .937',wht:'1 1 1'};
const esc=x=>String(x).replace(/[^\x00-\xff]/g,'-').replace(/([\\()])/g,'\\$1');
const R=(x,y,w,h,k)=>`${C[k]} rg ${x} ${H-y-h} ${w} ${h} re f\n`;
const tx=(x,X,y,z,b,k)=>`BT /F${b?2:1} ${z} Tf ${C[k]} rg ${X} ${H-y} Td (${esc(x)}) Tj ET\n`;
const tw=(x,z)=>String(x).split('').reduce((a,ch)=>a+(/[0-9$]/.test(ch)?556:/[ .,]/.test(ch)?278:600),0)*z/1000;
const tr=(x,X,y,z,b,k)=>tx(x,X-tw(x,z),y,z,b,k);
const ln=y=>`${C.lin} RG 0.7 w 40 ${H-y} m 555 ${H-y} l S\n`;
const wrap=(x,n)=>{const o=[''];String(x).split(' ').forEach(w=>{const l=o[o.length-1];if((l+' '+w).trim().length>n)o.push(w);else o[o.length-1]=(l+' '+w).trim()});return o.slice(0,3)};
const lw=72*LJ[0]/LJ[1],ls=wrap(Q.trab||'Trabajo de impresión',44);
let p=R(0,0,368,7,'red')+R(368,0,119,7,'yel')+R(487,0,108,7,'blu');
p+=`q ${lw} 0 0 72 40 ${H-30-72} cm /Im1 Do Q\n`;
p+=tx('PRESUPUESTO',390,64,20,1,'blu')+tx((Q.id?'N° '+pad(Q.id)+'  -  ':'')+new Date().toLocaleDateString('es-AR'),390,82,10,0,'gry');
p+=tx('Cliente:',40,140,11,0,'gry')+tx(Q.cli||'-',92,140,11,1,'ink');
p+=tx('Concepto',40,178,9,1,'gry')+tr('Cant.',340,178,9,1,'gry')+tr('Precio unit.',445,178,9,1,'gry')+tr('Subtotal',555,178,9,1,'gry')+ln(185);
ls.forEach((l,i)=>p+=tx(l,40,205+i*14,11,0,'ink'));
p+=tr(String(Q.cant),340,205,11,0,'ink')+tr(f(t.neto/(Q.cant||1)),445,205,11,0,'ink')+tr(f(t.neto),555,205,11,0,'ink');
const by=205+ls.length*14+4,y=by+30;p+=ln(by);
p+=tx('Subtotal',340,y,11,0,'ink')+tr(f(t.neto),555,y,11,0,'ink')+tx('IVA '+c.iva+'%',340,y+20,11,0,'ink')+tr(f(t.iva),555,y+20,11,0,'ink');
p+=R(330,y+32,225,28,'blu')+tx('Total',340,y+51,12,1,'wht')+tr(f(t.total),545,y+51,12,1,'wht');
p+=tx('Precio por unidad con IVA: '+f(t.u)+'  -  Válido por '+Q.val+' días.',40,y+88,9.5,0,'gry');
p+=R(0,H-32,W,32,'red')+tx((c.emp||'Imprenta Alberdi')+(c.contacto?'  -  '+c.contacto:''),40,H-13,10,1,'wht');
const L=x=>Uint8Array.from(x,ch=>ch.charCodeAt(0)&255),jb=Uint8Array.from(atob(LOGOJ),ch=>ch.charCodeAt(0));
const out=[],off=[];let pos=0;const add=x=>{const b=typeof x=='string'?L(x):x;out.push(b);pos+=b.length};
const obj=(n,b)=>{off[n]=pos;add(`${n} 0 obj\n${b}\nendobj\n`)};
add('%PDF-1.4\n');obj(1,'<</Type/Catalog/Pages 2 0 R>>');obj(2,'<</Type/Pages/Kids[3 0 R]/Count 1>>');
obj(3,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W} ${H}]/Resources<</Font<</F1 4 0 R/F2 5 0 R>>/XObject<</Im1 6 0 R>>>>/Contents 7 0 R>>`);
obj(4,'<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding/WinAnsiEncoding>>');obj(5,'<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold/Encoding/WinAnsiEncoding>>');
off[6]=pos;add(`6 0 obj\n<</Type/XObject/Subtype/Image/Width ${LJ[0]}/Height ${LJ[1]}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jb.length}>>\nstream\n`);add(jb);add('\nendstream\nendobj\n');
off[7]=pos;add(`7 0 obj\n<</Length ${L(p).length}>>\nstream\n${p}\nendstream\nendobj\n`);
const xp=pos;add('xref\n0 8\n0000000000 65535 f \n'+[1,2,3,4,5,6,7].map(n=>String(off[n]).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<</Size 8/Root 1 0 R>>\nstartxref\n${xp}\n%%EOF`);
return new Blob(out,{type:'application/pdf'})}
function pdfFile(){if(!Q.id)save();const n=`Presupuesto-${pad(Q.id)}-${(Q.cli||'cliente').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w]+/g,'-')}.pdf`;return new File([mkPdf()],n,{type:'application/pdf'})}
function dlPdf(){const f=pdfFile(),a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove()}
const b64=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(f)});
const wmsg=()=>`Hola${Q.cli?' '+Q.cli:''}, te envío el presupuesto N° ${pad(Q.id)} de ${S.cfg.emp||'Imprenta Alberdi'}.`;
async function sendPdf(){const f=pdfFile(),to=waNum(Q.tel);
if(!to){toast('Este presupuesto no tiene un cliente con celular. Elegí o creá uno en Clientes.');return}
if(WAAPI){try{toast('Enviando…');await api('wasend',{to,filename:f.name,caption:wmsg(),pdf:await b64(f)});toast('PDF enviado al WhatsApp de '+Q.cli);return}catch(x){toast('No se pudo enviar solo. Se abre el chat para enviarlo a mano.')}}
dlPdf();setTimeout(()=>window.open('https://wa.me/'+to+'?text='+encodeURIComponent(wmsg()+' Te adjunto el PDF.'),'_blank'),700)}
async function sharePdf(){const f=pdfFile();try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],text:wmsg(),title:'Presupuesto'});return}}catch(x){if(x&&x.name=='AbortError')return}dlPdf();toast('Se descargó el PDF. Adjuntalo en WhatsApp.')}
let WAAPI=false,online=false,PIN=localStorage.getItem('imp_pin')||'',tm;
const ss=t=>{const x=$('#sy');if(x)x.textContent=t};
async function api(a,b){const r=await fetch('api.php?a='+a,{method:b?'POST':'GET',headers:{'Content-Type':'application/json','X-PIN':PIN},body:b?JSON.stringify(b):undefined});if(r.status==401)throw 401;if(!r.ok)throw r.status;return r.json()}
const push=()=>{if(!online)return;clearTimeout(tm);tm=setTimeout(()=>api('put',{data:{cfg:S.cfg,hist:S.hist,n:S.n,cl:S.clientes}}).then(()=>ss('● Sincronizado')).catch(()=>ss('Error al sincronizar')),500)};
async function pull(){try{let d;try{d=await api('get')}catch(x){if(x!==401)throw x;PIN=prompt('PIN de la imprenta')||'';try{localStorage.setItem('imp_pin',PIN)}catch(y){}d=await api('get')}
online=true;WAAPI=!!d.wa;if(d.data){S.cfg={...def.cfg,...d.data.cfg};S.hist=d.data.hist||[];S.n=d.data.n||1;S.clientes=d.data.cl||S.clientes;try{localStorage.setItem(K0,JSON.stringify(S))}catch(y){}V();ss('● Sincronizado')}else{push();ss('● Conectado')}}catch(x){online=false;ss('Solo en este equipo')}}
$('#lg').src=LOGO;V();pull();
</script></body></html>
